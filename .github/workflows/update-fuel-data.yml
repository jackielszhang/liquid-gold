name: Update fuel data

on:
  schedule:
    # 08:15 SAST — CEF usually publishes the prior day's PDF by then.
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: update-fuel-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update fuel data
        run: python scripts/update_fuel_data.py

      - name: Upload raw sources on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuel-data-raw-sources
          path: data/raw/
          if-no-files-found: ignore

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit updated data
        run: |
          if git diff --quiet -- public/; then
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/
          # Drop the legacy rolling history file if it reappears.
          git rm -f --ignore-unmatch public/fuel-data-history.json
          git commit -m "Update fuel data"
          git push
