# Refresh public/fuel-data.json once a day so the iOS app can fetch raw GitHub.
# 06:15 UTC is early enough for SA morning widgets without racing source sites.
name: Update fuel data

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update fuel data
        run: python scripts/update_fuel_data.py

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit updated data
        run: |
          if git diff --quiet -- public/fuel-data.json public/fuel-data-history.json; then
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add public/fuel-data.json public/fuel-data-history.json data/raw
          git commit -m "Update fuel data"
          git push
